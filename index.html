<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Investigator Creator</title>
</head>

<body>
    <div>
        <h1>Investigator Creator</h1>
    </div>
    <div>
        <form id="investigator-form">
            <div>
                <label for="investigator-name">Investigator Name:</label>
                <input type="text" name="investigator name" id="investigator-name" required>
            </div>
            <div>
                <label for="occupation">Occupation</label>
                <select name="occupation" id="occupation">
                    <option value="professor">Professor</option>
                    <option value="labourer">Labourer</option>
                    <option value="detective">Detective</option>
                    <option value="fortuneTeller">Fortune Teller</option>
                </select>
            </div>
            <div id="character-stats">
                <div><span>Points left: </span><span id="manual-points">0</span></div>
                <div><span>Strength: </span><span id="strength-stat">0</span><button type="button"
                        id="strength-down-button">-</button><button type="button" id="strength-up-button">+</button>
                </div>
                <div><span>Dexterity: </span><span id="dexterity-stat">0</span><button type="button"
                        id="dexterity-down-button">-</button><button type="button" id="dexterity-up-button">+</button>
                </div>
                <div><span>Intelligence: </span><span id="intelligence-stat">0</span><button type="button"
                        id="intelligence-down-button">-</button><button type="button"
                        id="intelligence-up-button">+</button></div>
                <div><span>Perception: </span><span id="perception-stat">0</span><button type="button"
                        id="perception-down-button">-</button><button type="button" id="perception-up-button">+</button>
                </div>
                <div><span>Resolve: </span><span id="resolve-stat">0</span><button type="button"
                        id="resolve-down-button">-</button><button type="button" id="resolve-up-button">+</button></div>
                <div><span>Occult: </span><span id="occult-stat">0</span><button type="button"
                        id="occult-down-button">-</button><button type="button" id="occult-up-button">+</button></div>
                <button type="button" id="randomise-character">Randomise</button>
                <button type="button" id="reset-points">Reset Allocation</button>
            </div>
            <button type="submit" id="create-investigator">Create Investigator</button>
        </form>
        <div>
            <p style="color: red;" id="warning-messages"></p>
        </div>
    </div>
    <div>
        <div id="investigator-sheet"></div>
    </div>
    <script type="module" src="./js/script.js"></script>
</body>

</html>
