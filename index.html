<!DOCTYPE html>
<html lang="en" data-bs-theme="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/colourModeToggle.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Investigator Creator</title>
</head>

<body>
    <div class="container">
        <div class="text-center g-3">
            <h1>Investigator Creator</h1>
        </div>
        <div class="card mt-4">
            <form id="investigator-form" class="needs-validation" novalidate>
                <!--Investigator Name & Occupation-->
                <div class="card-header">
                    <div class="form-floating mb-3">
                        <input type="text" name="investigator name" id="investigator-name" class="form-control"
                            placeholder="character name" required>
                        <label for="investigator-name">Investigator Name</label>
                        <div class="invalid-feedback">Please give your Investigator a name</div>
                    </div>
                    <div class="mb-3 text-center">
                        <label for="occupation" class="form-label">Occupation</label>
                        <select name="occupation" id="occupation" class="form-select" required>
                            <option value="professor">Professor</option>
                            <option value="labourer">Labourer</option>
                            <option value="detective">Detective</option>
                            <option value="fortuneTeller">Fortune Teller</option>
                        </select>
                    </div>
                </div>
                <!--Stats & Points-->
                <!--Manual Points-->
                <div class="col">
                    <div id="character-stats" class="border rounded p-2 text-center">
                        <div class="text-capitalize text-body-secondary">
                            <span>Points left: </span>
                        </div>
                        <div class="fs-4 fw-semibold"><span id="manual-points">0</span></div>
                        <div id="points-warning" class="invalid-feedback" role="alert">You still have points to
                            spend</div>
                    </div>
                </div>
                <div class="row row-cols-2 row-cols-sm-3 g-2">
                    <!--Strength-->
                    <div class="col">
                        <div class="border rounded p-2 text-center">
                            <div class="text-capitalize text-body-secondary">
                                <span class="stat-label">Strength: </span>
                            </div>
                            <div class="fs-4 fw-semibold"><span id="strength-stat" class="stat-value">0</span></div>
                            <button type="button" id="strength-down-button"
                                class="btn btn-sm btn-danger mx-2">-</button><button type="button"
                                id="strength-up-button" class="btn btn-sm btn-success">+</button>
                        </div>
                    </div>
                    <!--Dexterity-->
                    <div class="col">
                        <div class="border rounded p-2 text-center">
                            <div class="text-capitalize text-body-secondary">
                                <span class="stat-label">Dexterity: </span>
                            </div>
                            <div class="fs-4 fw-semibold"><span id="dexterity-stat" class="stat-value">0</span></div>
                            <button type="button" id="dexterity-down-button"
                                class="btn btn-sm btn-danger mx-2">-</button><button type="button"
                                id="dexterity-up-button" class="btn btn-sm btn-success">+</button>
                        </div>
                    </div>
                    <!--Intelligence-->
                    <div class="col">
                        <div class="border rounded p-2 text-center">
                            <div class="text-capitalize text-body-secondary">
                                <span class="stat-label">Intelligence: </span>
                            </div>
                            <div class="fs-4 fw-semibold"><span id="intelligence-stat" class="stat-value">0</span></div>
                            <button type="button" id="intelligence-down-button"
                                class="btn btn-sm btn-danger mx-2">-</button><button type="button"
                                id="intelligence-up-button" class="btn btn-sm btn-success">+</button>
                        </div>
                    </div>
                    <!--Perception-->
                    <div class="col">
                        <div class="border rounded p-2 text-center">
                            <div class="text-capitalize text-body-secondary">
                                <span class="stat-label">Perception: </span>
                            </div>
                            <div class="fs-4 fw-semibold"><span id="perception-stat" class="stat-value">0</span></div>
                            <button type="button" id="perception-down-button"
                                class="btn btn-sm btn-danger mx-2">-</button><button type="button"
                                id="perception-up-button" class="btn btn-sm btn-success">+</button>
                        </div>
                    </div>
                    <!--Resolve-->
                    <div class="col">
                        <div class="border rounded p-2 text-center">
                            <div class="text-capitalize text-body-secondary">
                                <span class="stat-label">Resolve: </span>
                            </div>
                            <div class="fs-4 fw-semibold"><span id="resolve-stat" class="stat-value">0</span>
                            </div>
                            <button type="button" id="resolve-down-button"
                                class="btn btn-sm btn-danger mx-2">-</button><button type="button"
                                id="resolve-up-button" class="btn btn-sm btn-success">+</button>
                        </div>
                    </div>
                    <!--Occult-->
                    <div class="col">
                        <div class="border rounded p-2 text-center">
                            <div class="text-capitalize text-body-secondary">
                                <span class="stat-label">Occult: </span>
                            </div>
                            <div class="fs-4 fw-semibold"><span id="occult-stat" class="stat-value">0</span></div>
                            <button type="button" id="occult-down-button"
                                class="btn btn-sm btn-danger mx-2">-</button><button type="button" id="occult-up-button"
                                class="btn btn-sm btn-success">+</button>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="border rounded p-2 text-center">
                        <button type="button" id="randomise-character"
                            class="btn btn-outline-warning">Randomise</button>
                        <button type="button" id="reset-points" class="btn btn-outline-danger">Reset
                            Allocation</button>
                    </div>
                    <div class="border rounded p-2 text-center">
                        <button type="submit" id="create-investigator" class="btn btn-primary">Create
                            Investigator</button>
                    </div>
                </div>
                <div id="warning-messages" class="p-2"></div>
            </form>
        </div>
        <div>
            <div id="investigator-sheet"></div>
        </div>
    </div>
    <script type="module" src="./js/script.js"></script>
</body>

</html>
