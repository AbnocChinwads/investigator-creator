<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Investigator Creator</title>
</head>
<body>
    <div>
        <h1>Investigator Creator</h1>
    </div>
    <div>
        <label for="investigator-name">Investigator Name:</label>
        <input type="text" name="investigator name" id="investigator-name">
    </div>
    <div>
        <label for="occupation">Occupation</label>
        <select name="occupation" id="occupation">
            <option value="professor">Professor</option>
            <option value="labourer">Labourer</option>
            <option value="detective">Detective</option>
            <option value="fortuneTeller">Fortune Teller</option>
        </select>
    </div>
    <div id="character-stats">
        <!--Player stats go here once JS has parsed them-->
    </div>
    <script type="module" src="./js/script.js"></script>
</body>
</html>
